name: Deploy Neon Bay v1.8 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified v1.8 release
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare v1.8 packaging tools
        run: |
          node scripts/prepare-v17-release-tools.mjs
          node scripts/fix-v17-validator.mjs
          node scripts/prepare-v18-release-tools.mjs

      - name: Verify committed production files
        run: |
          node scripts/verify-static-deployment.mjs
          node scripts/package-v18-release.mjs --verify-only vercel-static
          node scripts/test-v18-recovery.mjs vercel-static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v1.8 production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vercel-static

      - name: Deploy v1.8 production
        id: deployment
        uses: actions/deploy-pages@v4
