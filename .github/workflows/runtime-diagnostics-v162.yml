name: Neon Bay v1.7 release diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-bay-v17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build v1.7 release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime-diagnostics
          npm run build:release 2>&1 | tee runtime-diagnostics/build.log
      - name: Verify source and packaged release
        run: |
          npm run test:v17
          node scripts/package-v17-release.mjs --verify-only dist
          node scripts/test-v17-recovery.mjs dist
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run rendered browser diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-diagnostics
          python3 -m http.server 4173 --directory dist >runtime-diagnostics/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/runtime-v17-smoke.mjs 2>&1 | tee runtime-diagnostics/browser.log
      - name: Publish verified static directory
        if: success() && github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          rm -rf vercel-static
          mkdir -p vercel-static
          cp -a dist/. vercel-static/
          npm run verify:v17
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vercel-static
          if git diff --cached --quiet; then
            echo "Verified v1.7 static directory is already current."
          else
            git commit -m "Publish verified Neon Bay v1.7 static release"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Archive source snapshot
        if: always()
        run: git archive --format=zip --output=runtime-diagnostics/neon-bay-v17-source.zip HEAD
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-bay-v17-runtime-diagnostics
          path: runtime-diagnostics/
          if-no-files-found: error
          retention-days: 7
