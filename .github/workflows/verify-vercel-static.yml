name: Verify Neon Bay v1.8 static release

on:
  pull_request:
    branches: [main]
    paths:
      - 'vercel-static/**'
      - 'scripts/prepare-v17-release-tools.mjs'
      - 'scripts/prepare-v18-release-tools.mjs'
      - 'scripts/test-v18-recovery.mjs'
      - 'scripts/verify-static-deployment.mjs'
      - '.github/workflows/verify-vercel-static.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare v1.8 packaging tools
        run: |
          node scripts/prepare-v17-release-tools.mjs
          node scripts/prepare-v18-release-tools.mjs
      - name: Verify browser-ready v1.8 release
        run: |
          node scripts/verify-static-deployment.mjs
          node scripts/package-v18-release.mjs --verify-only vercel-static
          node scripts/test-v18-recovery.mjs vercel-static
