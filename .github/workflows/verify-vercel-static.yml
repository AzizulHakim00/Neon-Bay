name: Verify Neon Bay Vercel static release

on:
  pull_request:
    branches: [main]
    paths:
      - 'vercel-static/**'
      - 'scripts/package-v161-hotfix.mjs'
      - 'scripts/prepare-v161-packager.mjs'
      - 'scripts/test-v161-recovery.mjs'
      - '.github/workflows/verify-vercel-static.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify browser-ready v1.6.1 release
        run: |
          node scripts/prepare-v161-packager.mjs
          node scripts/package-v161-hotfix.mjs --verify-only vercel-static
          node scripts/test-v161-recovery.mjs vercel-static
