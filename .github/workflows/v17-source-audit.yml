name: Neon Bay v1.8 Source Audit

on:
  push:
    branches:
      - agent/neon-bay-v1.8-empire-expansion
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:source
      - run: npm run test:v18
      - name: Export generated source
        run: |
          mkdir -p audit
          cp -R src audit/src
          cp index.html package.json vite.config.mjs audit/
          find audit -maxdepth 3 -type f -print | sort > audit/file-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: neon-bay-v18-generated-source
          path: audit
          if-no-files-found: error
          retention-days: 3
