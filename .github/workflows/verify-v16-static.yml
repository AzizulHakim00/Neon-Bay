name: Verify Neon Bay v1.6.1 static release

on:
  pull_request:
    paths:
      - 'vercel-static/**'
      - 'scripts/package-v161-hotfix.mjs'
      - 'scripts/prepare-v161-packager.mjs'
      - 'scripts/test-v161-recovery.mjs'
      - '.github/workflows/verify-v16-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify bundled v1.6.1 release
        run: |
          node scripts/prepare-v161-packager.mjs
          node scripts/package-v161-hotfix.mjs --verify-only vercel-static
          node scripts/test-v161-recovery.mjs vercel-static
