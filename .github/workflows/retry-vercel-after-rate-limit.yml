name: Verify and retry Neon Bay v1.8 Vercel production

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: neon-bay-vercel-retry
  cancel-in-progress: false

jobs:
  retry-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare v1.8 packaging tools
        run: |
          node scripts/prepare-v17-release-tools.mjs
          node scripts/fix-v17-validator.mjs
          node scripts/prepare-v18-release-tools.mjs

      - name: Verify deployable v1.8 static release
        run: |
          node scripts/verify-static-deployment.mjs
          node scripts/package-v18-release.mjs --verify-only vercel-static
          node scripts/test-v18-recovery.mjs vercel-static

      - name: Inspect latest Vercel status
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          response="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status")"
          latest="$(jq -c '[.statuses[] | select(.context == "Vercel")] | sort_by(.updated_at) | last // {}' <<<"$response")"
          state="$(jq -r '.state // "missing"' <<<"$latest")"
          target="$(jq -r '.target_url // ""' <<<"$latest")"
          description="$(jq -r '.description // ""' <<<"$latest")"

          echo "Commit: ${sha}"
          echo "Vercel state: ${state}"
          echo "Vercel target: ${target}"
          echo "Vercel description: ${description}"

          retry=false
          case "$state" in
            success)
              echo "Vercel v1.8 deployment succeeded."
              ;;
            pending)
              echo "A Vercel deployment is already running."
              ;;
            failure)
              retry=true
              echo "Vercel failed the verified v1.8 deployment; requesting a retry."
              ;;
            missing)
              commit_time="$(git show -s --format=%ct HEAD)"
              now="$(date +%s)"
              age="$((now - commit_time))"
              if (( age >= 1200 )); then
                retry=true
                echo "No Vercel status appeared after 20 minutes; requesting a retry."
              else
                echo "The main commit is recent; allowing Vercel more time."
              fi
              ;;
            *)
              retry=true
              echo "Unknown Vercel status; requesting a retry."
              ;;
          esac

          echo "retry=${retry}" >> "$GITHUB_OUTPUT"

      - name: Trigger fresh verified v1.8 Vercel deployment
        if: steps.vercel.outputs.retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "neon-bay-deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: retry verified Neon Bay v1.8 Vercel deployment"
          git push origin HEAD:main
